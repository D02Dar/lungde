[project]
name = "went-respiratory-backend"
version = "0.1.0"
description = "FastAPI offline offline RGB respiratory analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "opencv-python-headless>=4.10,<5",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
